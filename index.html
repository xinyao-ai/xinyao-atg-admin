<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芯瑤💕ATG 管理後台</title>
<style>
:root{--p:#ef4d91;--bg:#fff6fa;--line:#f2dbe6;--muted:#8b7882;--red:#e84c69}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:#302830}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#fff;padding:20px 14px;border-right:1px solid var(--line)}.brand{font-size:19px;font-weight:900;padding:10px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;padding:12px;text-align:left;border-radius:12px;font-weight:800}.nav button.active{background:linear-gradient(135deg,#ff91bc,var(--p));color:#fff}.main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 10px 30px #d9548b10}.stat b{display:block;font-size:28px;margin-top:6px}.muted{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap}.input,select,textarea{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fffafd}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.soft{background:#fff0f6;color:#d83d7d}.danger{background:var(--red);color:#fff}.table{overflow:auto;border:1px solid var(--line);border-radius:13px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px;border-bottom:1px solid #f6e8ee;text-align:left;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.win{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.win img{max-width:180px;max-height:130px;border-radius:9px;display:block;margin-top:8px}@media(max-width:850px){.app{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:14px}}
</style>
<style id="admin-auth-style">
#adminLogin{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#fff7fb,#ffeaf3)}
.loginCard{width:min(390px,100%);background:#fff;border:1px solid #f2dbe6;border-radius:24px;padding:28px;box-shadow:0 22px 70px #c93e7a22;text-align:center}
.loginLogo{font-size:42px;margin-bottom:5px}.loginCard h2{margin:4px 0 5px}.loginCard p{margin:0 0 18px;color:#8b7882;font-size:13px}
.loginCard input{width:100%;margin:6px 0;padding:13px;border:1px solid #f2dbe6;border-radius:13px;background:#fffafd;font-size:15px}
.loginCard button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff91bc,#ef4d91);color:#fff;font-weight:900;cursor:pointer}
#loginError{min-height:20px;margin-top:10px;color:#e84c69;font-size:12px;font-weight:800}
#logoutBtn{display:none}
</style>

<style id="mobile-admin-layout">
@media (max-width: 700px){
  body{background:#fff7fb}
  .app{display:block;min-height:100vh}
  .side{
    position:sticky;top:0;z-index:50;height:auto;
    padding:10px 10px 8px;
    border-right:0;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
  }
  .brand{
    padding:5px 4px 9px;
    font-size:17px;
    text-align:center;
  }
  .nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:3px;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    flex:0 0 auto;
    white-space:nowrap;
    padding:9px 11px;
    border-radius:999px;
    font-size:12px;
  }

  .main{padding:12px 10px 28px}
  .top{
    position:sticky;top:86px;z-index:35;
    background:rgba(255,247,251,.94);
    backdrop-filter:blur(10px);
    margin:-2px -2px 10px;
    padding:8px 2px;
    gap:8px;
  }
  .top h2{font-size:20px;margin:0}
  .top .row{gap:6px;flex-wrap:nowrap}
  .top .btn{padding:8px 10px;font-size:12px}

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }
  .card{
    border-radius:16px;
    padding:13px;
    margin:10px 0;
  }
  .stat b{font-size:25px}
  .muted{font-size:12px}

  .row{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .row .input,
  .row select,
  .row textarea,
  .row .btn{
    width:100%;
    min-width:0;
  }
  .input,select,textarea{
    width:100%;
    font-size:16px;
  }
  .btn{min-height:42px}

  .two{grid-template-columns:1fr}

  /* 手機版把會員表格改成卡片，不再左右拖 */
  #members .table,
  #logs .table,
  #activity .table{
    overflow:visible;
    border:0;
  }
  #members table,
  #logs table,
  #activity table{
    min-width:0;
    width:100%;
  }
  #members thead,
  #logs thead,
  #activity thead{display:none}

  #members tbody,
  #logs tbody,
  #activity tbody{
    display:grid;
    gap:10px;
  }
  #members tr,
  #logs tr,
  #activity tr{
    display:block;
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    padding:10px 12px;
    box-shadow:0 8px 22px #d9548b0c;
  }
  #members td,
  #logs td,
  #activity td{
    display:grid;
    grid-template-columns:82px 1fr;
    gap:8px;
    align-items:start;
    padding:7px 0;
    border-bottom:1px dashed #f3e5ec;
    font-size:13px;
    word-break:break-word;
  }
  #members td:last-child,
  #logs td:last-child,
  #activity td:last-child{border-bottom:0}

  #members td:nth-child(1)::before{content:"ID"}
  #members td:nth-child(2)::before{content:"帳號"}
  #members td:nth-child(3)::before{content:"狀態"}
  #members td:nth-child(4)::before{content:"最後登入"}
  #members td:nth-child(5)::before{content:"最後活動"}
  #members td:nth-child(6)::before{content:"到期日"}
  #members td:nth-child(7)::before{content:"操作"}

  #logs td:nth-child(1)::before{content:"時間"}
  #logs td:nth-child(2)::before{content:"管理員"}
  #logs td:nth-child(3)::before{content:"操作"}
  #logs td:nth-child(4)::before{content:"對象"}
  #logs td:nth-child(5)::before{content:"內容"}

  #activity td:nth-child(1)::before{content:"時間"}
  #activity td:nth-child(2)::before{content:"會員"}
  #activity td:nth-child(3)::before{content:"操作"}
  #activity td:nth-child(4)::before{content:"內容"}
  #activity td:nth-child(5)::before{content:"裝置"}

  #members td::before,
  #logs td::before,
  #activity td::before{
    color:#9b7f8d;
    font-weight:800;
    font-size:12px;
  }

  #members td:last-child{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
  }
  #members td:last-child::before{
    width:82px;
    flex:0 0 82px;
  }
  #members td:last-child .btn{
    width:auto;
    min-height:36px;
    padding:8px 10px;
  }

  #detailBox .input,
  #detailBox select,
  #detailBox .btn{
    width:100%;
    margin:5px 0;
  }

  .win img{
    max-width:100%;
    width:100%;
    height:auto;
  }

  #adminLogin{padding:14px}
  .loginCard{
    width:100%;
    max-width:420px;
    padding:24px 18px;
    border-radius:22px;
  }
}

@media (max-width: 420px){
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:12px}
  .stat b{font-size:22px}
  .top{top:84px}
}
</style>

</head><body>
<div id="adminLogin">
  <div class="loginCard">
    <div class="loginLogo">💕</div>
    <h2>芯瑤 ATG 管理後台</h2>
    <p>管理員登入</p>
    <input id="adminUser" autocomplete="username" placeholder="管理員帳號">
    <input id="adminPass" type="password" autocomplete="current-password" placeholder="管理員密碼">
    <button onclick="adminLogin()">登入後台</button>
    <div id="loginError"></div>
  </div>
</div>
<div class="app"><aside class="side"><div class="brand">💕 芯瑤 ATG 後台</div><nav class="nav">
<button class="active" data-tab="overview">📊 總覽</button><button data-tab="members">👥 會員管理</button><button data-tab="detail">🪪 會員詳細</button><button data-tab="kick">🚪 強制登出</button><button data-tab="batch">➕ 批次新增</button><button data-tab="wins">🎉 恭喜會員</button><button data-tab="system">🟢 系統狀態</button><button data-tab="logs">🧾 操作紀錄</button><button data-tab="activity">👀 上線／操作</button></nav></aside>
<main class="main"><div class="top"><h2 id="title">總覽儀表板</h2><div class="row"><button class="btn soft" onclick="refreshAll()">↻ 更新</button><button id="logoutBtn" class="btn danger" onclick="adminLogout()">登出</button></div></div>
<section id="overview" class="panel active"><div class="stats"><div class="card stat"><span class="muted">會員總數</span><b id="total">—</b></div><div class="card stat"><span class="muted">正常會員</span><b id="active">—</b></div><div class="card stat"><span class="muted">停用會員</span><b id="disabled">—</b></div><div class="card stat"><span class="muted">目前上線</span><b id="online">—</b></div><div class="card stat"><span class="muted">今日新增</span><b id="today_new">—</b></div></div><div class="card"><b>最近會員操作</b><div id="recent" class="muted">載入中...</div></div></section>
<section id="members" class="panel"><div class="card"><div class="row"><input id="search" class="input" placeholder="搜尋會員"><button class="btn soft" onclick="loadMembers()">搜尋</button><input id="newAccount" class="input" placeholder="新增會員帳號"><button class="btn primary" onclick="addMember()">新增會員</button></div><div id="memberMsg"></div><div class="table"><table><thead><tr><th>ID</th><th>帳號</th><th>狀態</th><th>最後登入</th><th>最後活動</th><th>到期日</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table></div></div></section>
<section id="detail" class="panel"><div class="card"><div class="row"><input id="detailId" class="input" placeholder="會員 ID"><button class="btn primary" onclick="loadDetail()">讀取</button></div><div id="detailBox" class="muted">請選會員。</div></div></section>
<section id="kick" class="panel"><div class="card"><div class="row"><input id="kickId" class="input" placeholder="會員 ID"><button class="btn danger" onclick="kick()">強制登出</button></div><div id="kickMsg"></div><p class="muted">ATG 前台需同步檢查 force_logout，才能真正踢下線。</p></div></section>
<section id="batch" class="panel"><div class="card"><textarea id="batchText" rows="10" style="width:100%" placeholder="每行一個會員帳號"></textarea><button class="btn primary" onclick="batchAdd()">批次新增</button><div id="batchMsg"></div></div></section>
<section id="wins" class="panel"><div class="two"><div class="card"><input id="wm" class="input" placeholder="m*****16"><input id="wa" class="input" type="number" placeholder="24270"><input id="wt" class="input" value="使用此程式贏得"><input id="wi" class="input" placeholder="照片網址"><button class="btn primary" onclick="addWin()">新增喜報</button><div id="winMsg"></div></div><div class="card"><div id="winList"></div></div></div></section>
<section id="system" class="panel"><div class="card" id="systemBox">檢查中...</div></section>
<section id="logs" class="panel"><div class="card"><div class="table"><table><thead><tr><th>時間</th><th>管理員</th><th>操作</th><th>對象</th><th>內容</th></tr></thead><tbody id="logRows"></tbody></table></div></div></section>
<section id="activity" class="panel"><div class="card"><div class="table"><table><thead><tr><th>時間</th><th>會員</th><th>操作</th><th>內容</th><th>裝置</th></tr></thead><tbody id="activityRows"></tbody></table></div></div></section>
</main></div>
<script>
const API="https://xinyao-atg-admin-api.love06130430.workers.dev",E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),F=s=>s?new Date(s+"Z").toLocaleString("zh-TW",{hour12:false}):"—";
async function A(p,o={}){
  const token=sessionStorage.getItem("atg_admin_token")||"";
  let r=await fetch(API+p,{
    cache:"no-store",
    ...o,
    headers:{
      "Content-Type":"application/json",
      ...(token?{"Authorization":"Bearer "+token}:{}),
      ...(o.headers||{})
    }
  });
  let d=await r.json();
  if(r.status===401 && p!=="/admin/login"){
    adminLogout(false);
    throw Error(d.message||"登入已失效");
  }
  if(!r.ok||!d.ok)throw Error(d.message||d.error||"失敗");
  return d
}
const titles={overview:"總覽儀表板",members:"會員管理",detail:"會員詳細資料",kick:"強制登出",batch:"批次新增會員",wins:"恭喜會員紀錄",system:"系統狀態",logs:"操作紀錄",activity:"會員上線／操作紀錄"};
document.addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(!b)return;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.tab).classList.add("active");title.textContent=titles[b.dataset.tab];if(b.dataset.tab==="members")loadMembers();if(b.dataset.tab==="wins")loadWins();if(b.dataset.tab==="logs")loadLogs();if(b.dataset.tab==="activity")loadActivity();if(b.dataset.tab==="system")health()});
async function stats(){try{let s=(await A("/stats")).stats;for(let k of ["total","active","disabled","online","today_new"])document.getElementById(k).textContent=s[k]??0}catch(e){}}
async function loadMembers(){try{let d=await A("/members"+(search.value.trim()?"?q="+encodeURIComponent(search.value.trim()):""));memberRows.innerHTML=d.members.map(m=>`<tr><td>${m.id}</td><td>${E(m.account)}</td><td>${E(m.status)}</td><td>${F(m.last_login_at)}</td><td>${F(m.last_seen_at)}</td><td>${E(m.expires_at||"永久")}</td><td><button class="btn soft" onclick="openDetail(${m.id})">詳細</button> <button class="btn danger" onclick="quickKick(${m.id})">登出</button></td></tr>`).join("")||'<tr><td colspan="7">沒有會員</td></tr>'}catch(e){memberMsg.textContent=e.message}}
async function addMember(){try{let d=await A("/members",{method:"POST",body:JSON.stringify({account:newAccount.value.trim()})});memberMsg.textContent=d.message;newAccount.value="";loadMembers();stats()}catch(e){memberMsg.textContent=e.message}}
async function batchAdd(){try{let accounts=batchText.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),d=await A("/members/batch",{method:"POST",body:JSON.stringify({accounts})});batchMsg.textContent=`新增 ${d.added}，略過 ${d.skipped}`;stats()}catch(e){batchMsg.textContent=e.message}}
function openDetail(id){detailId.value=id;document.querySelector('[data-tab="detail"]').click();loadDetail()}
async function loadDetail(){try{let d=await A("/members/"+detailId.value),m=d.member;detailBox.innerHTML=`<p><b>帳號：</b>${E(m.account)}</p><p>建立：${F(m.created_at)}</p><select id="es"><option value="active" ${m.status==="active"?"selected":""}>active</option><option value="disabled" ${m.status!=="active"?"selected":""}>disabled</option></select> <input id="ee" class="input" placeholder="到期日" value="${E(m.expires_at||"")}"> <input id="en" class="input" placeholder="備註" value="${E(m.note||"")}"> <button class="btn primary" onclick="saveDetail(${m.id})">儲存</button><hr>${d.activity.map(a=>`<p>${F(a.created_at)}｜${E(a.action)}｜${E(a.detail||"")}</p>`).join("")||"尚無操作"}`}catch(e){detailBox.textContent=e.message}}
async function saveDetail(id){try{await A("/members/"+id,{method:"PATCH",body:JSON.stringify({status:es.value,expires_at:ee.value||null,note:en.value})});alert("已儲存");loadDetail();stats()}catch(e){alert(e.message)}}
async function kick(){try{kickMsg.textContent=(await A("/members/"+kickId.value+"/force-logout",{method:"POST"})).message}catch(e){kickMsg.textContent=e.message}}
async function quickKick(id){if(confirm("確定強制登出？"))try{await A("/members/"+id+"/force-logout",{method:"POST"});alert("完成")}catch(e){alert(e.message)}}
async function loadActivity(){try{let d=await A("/activity");activityRows.innerHTML=d.activity.map(a=>`<tr><td>${F(a.created_at)}</td><td>${E(a.account)}</td><td>${E(a.action)}</td><td>${E(a.detail||"")}</td><td>${E(a.device||"")}</td></tr>`).join("");recent.innerHTML=d.activity.slice(0,8).map(a=>`<p>${E(a.account)}｜${E(a.action)}｜${F(a.created_at)}</p>`).join("")||"尚無紀錄"}catch(e){}}
async function loadLogs(){try{let d=await A("/admin-logs");logRows.innerHTML=d.logs.map(x=>`<tr><td>${F(x.created_at)}</td><td>${E(x.admin)}</td><td>${E(x.action)}</td><td>${E(x.target||"")}</td><td>${E(x.detail||"")}</td></tr>`).join("")}catch(e){}}
async function loadWins(){try{let d=await A("/wins");winList.innerHTML=d.wins.map(w=>`<div class="win"><b>${E(w.member_display)}｜${Number(w.amount).toLocaleString()}</b><div>${E(w.message)}</div>${w.image_url?`<img src="${E(w.image_url)}">`:""}<button class="btn soft" onclick="toggleWin(${w.id},${w.is_visible?0:1})">${w.is_visible?"隱藏":"顯示"}</button> <button class="btn danger" onclick="delWin(${w.id})">刪除</button></div>`).join("")||"尚無喜報"}catch(e){winList.textContent=e.message}}
async function addWin(){try{let d=await A("/wins",{method:"POST",body:JSON.stringify({member_display:wm.value,amount:wa.value,message:wt.value,image_url:wi.value})});winMsg.textContent=d.message;loadWins()}catch(e){winMsg.textContent=e.message}}
async function toggleWin(id,v){await A("/wins/"+id,{method:"PATCH",body:JSON.stringify({is_visible:v})});loadWins()}async function delWin(id){if(confirm("確定刪除？")){await A("/wins/"+id,{method:"DELETE"});loadWins()}}
async function health(){try{await A("/health");systemBox.innerHTML="🟢 Worker：正常<br>🟢 D1：正常"}catch(e){systemBox.textContent="🔴 "+e.message}}
async function refreshAll(){await Promise.allSettled([stats(),loadMembers(),loadActivity(),loadLogs(),loadWins(),health()])}
async function adminLogin(){
  document.getElementById("loginError").textContent="";
  try{
    const r=await fetch(API+"/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:document.getElementById("adminUser").value.trim(),password:document.getElementById("adminPass").value})
    });
    const d=await r.json();
    if(!r.ok||!d.ok)throw Error(d.message||"登入失敗");
    sessionStorage.setItem("atg_admin_token",d.token);
    document.getElementById("adminPass").value="";
    adminLoginScreen(false);
    await refreshAll();
  }catch(e){document.getElementById("loginError").textContent=e.message}
}
function adminLoginScreen(show){
  const loginScreen = document.getElementById("adminLogin");
  const logoutButton = document.getElementById("logoutBtn");
  if(loginScreen) loginScreen.style.display = show ? "flex" : "none";
  if(logoutButton) logoutButton.style.display = show ? "none" : "inline-block";
}
function adminLogout(show=true){
  sessionStorage.removeItem("atg_admin_token");
  adminLoginScreen(true);
  if(show) document.getElementById("loginError").textContent="已登出";
}
async function checkAdminSession(){
  const token=sessionStorage.getItem("atg_admin_token");
  if(!token){adminLoginScreen(true);return}
  try{await A("/admin/session");adminLoginScreen(false);await refreshAll()}
  catch{adminLoginScreen(true)}
}
document.getElementById("adminPass").addEventListener("keydown",e=>{if(e.key==="Enter")adminLogin()});
document.getElementById("adminUser").addEventListener("keydown",e=>{if(e.key==="Enter")adminLogin()});
checkAdminSession();
setInterval(()=>{if(sessionStorage.getItem("atg_admin_token")){stats();loadActivity()}},60000);

</script></body></html>
